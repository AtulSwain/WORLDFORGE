# Local development stack.
#   docker compose up -d db            # just PostgreSQL, run the app with `npm run dev`
#   docker compose up --build          # everything: database, migrations + seed, app on :3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: worldforge
      POSTGRES_PASSWORD: worldforge
      POSTGRES_DB: worldforge
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldforge -d worldforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://worldforge:worldforge@db:5432/worldforge
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://worldforge:worldforge@db:5432/worldforge
      APP_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      STORAGE_DRIVER: local
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  uploads:
